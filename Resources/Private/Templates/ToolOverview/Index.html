<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:be="http://typo3.org/ns/TYPO3/CMS/Backend/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:layout name="Backend" />

<f:section name="Content">

    <h1><f:translate key="LLL:EXT:webmcp/Resources/Private/Language/locallang.xlf:overview.title" /></h1>

    <div class="btn-group mb-3">
        <a href="{f:be.uri(route: 'content_webmcp')}" class="btn btn-default btn-sm active">
            <f:translate key="LLL:EXT:webmcp/Resources/Private/Language/locallang.xlf:nav.overview" />
        </a>
        <a href="{f:be.uri(route: 'content_webmcp.log')}" class="btn btn-default btn-sm">
            <f:translate key="LLL:EXT:webmcp/Resources/Private/Language/locallang.xlf:nav.log" />
        </a>
        <a href="{f:be.uri(route: 'content_webmcp.consent')}" class="btn btn-default btn-sm">
            <f:translate key="LLL:EXT:webmcp/Resources/Private/Language/locallang.xlf:nav.consent" />
        </a>
    </div>

    <p>
        <f:translate key="LLL:EXT:webmcp/Resources/Private/Language/locallang.xlf:overview.providers" />:
        <f:for each="{providers}" as="provider">
            <span class="badge badge-default">{provider}</span>
        </f:for>
    </p>

    <div class="table-fit">
        <table class="table table-striped table-hover">
            <thead>
                <tr>
                    <th><f:translate key="LLL:EXT:webmcp/Resources/Private/Language/locallang.xlf:overview.site" /></th>
                    <th><f:translate key="LLL:EXT:webmcp/Resources/Private/Language/locallang.xlf:overview.rootPage" /></th>
                    <th><f:translate key="LLL:EXT:webmcp/Resources/Private/Language/locallang.xlf:overview.baseUrl" /></th>
                    <th><f:translate key="LLL:EXT:webmcp/Resources/Private/Language/locallang.xlf:overview.enabled" /></th>
                    <th><f:translate key="LLL:EXT:webmcp/Resources/Private/Language/locallang.xlf:overview.tools" /></th>
                    <th><f:translate key="LLL:EXT:webmcp/Resources/Private/Language/locallang.xlf:overview.totalCalls" /></th>
                </tr>
            </thead>
            <tbody>
                <f:for each="{sites}" as="site">
                    <tr>
                        <td><strong>{site.identifier}</strong></td>
                        <td>{site.rootPageId}</td>
                        <td>{site.base}</td>
                        <td>
                            <f:if condition="{site.enabled}">
                                <f:then><span class="badge badge-success">
                                    <f:translate key="LLL:EXT:webmcp/Resources/Private/Language/locallang.xlf:overview.yes" />
                                </span></f:then>
                                <f:else><span class="badge badge-danger">
                                    <f:translate key="LLL:EXT:webmcp/Resources/Private/Language/locallang.xlf:overview.no" />
                                </span></f:else>
                            </f:if>
                        </td>
                        <td>
                            <f:for each="{site.tools}" as="tool" key="toolName">
                                <f:if condition="{tool.enabled}">
                                    <f:then><span class="badge badge-info">{toolName}</span></f:then>
                                    <f:else><span class="badge badge-secondary"><s>{toolName}</s></span></f:else>
                                </f:if>
                            </f:for>
                        </td>
                        <td>
                            {site.logCount}
                            <f:if condition="{site.toolCounts}">
                                <small class="text-muted">
                                    (<f:for each="{site.toolCounts}" as="count" key="name" iteration="iter">{name}: {count}<f:if condition="!{iter.isLast}">, </f:if></f:for>)
                                </small>
                            </f:if>
                        </td>
                    </tr>
                </f:for>
            </tbody>
        </table>
    </div>

</f:section>

</html>
