<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:be="http://typo3.org/ns/TYPO3/CMS/Backend/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:layout name="Backend" />

<f:section name="Content">

    <h1><f:translate key="LLL:EXT:webmcp/Resources/Private/Language/locallang.xlf:log.title" /></h1>

    <div class="btn-group mb-3">
        <a href="{f:be.uri(route: 'content_webmcp')}" class="btn btn-default btn-sm">
            <f:translate key="LLL:EXT:webmcp/Resources/Private/Language/locallang.xlf:nav.overview" />
        </a>
        <a href="{f:be.uri(route: 'content_webmcp.log')}" class="btn btn-default btn-sm active">
            <f:translate key="LLL:EXT:webmcp/Resources/Private/Language/locallang.xlf:nav.log" />
        </a>
        <a href="{f:be.uri(route: 'content_webmcp.consent')}" class="btn btn-default btn-sm">
            <f:translate key="LLL:EXT:webmcp/Resources/Private/Language/locallang.xlf:nav.consent" />
        </a>
    </div>

    <form method="get" class="mb-3">
        <div class="row">
            <div class="col-md-4">
                <label class="form-label"><f:translate key="LLL:EXT:webmcp/Resources/Private/Language/locallang.xlf:log.selectSite" /></label>
                <select name="site" class="form-select">
                    <option value="">--</option>
                    <f:for each="{sites}" as="site">
                        <option value="{site.identifier}" selected="{f:if(condition: '{selectedSite} == {site.identifier}', then: 'selected')}">
                            {site.label}
                        </option>
                    </f:for>
                </select>
            </div>
            <div class="col-md-2 align-self-end">
                <button type="submit" class="btn btn-primary">
                    <f:translate key="LLL:EXT:webmcp/Resources/Private/Language/locallang.xlf:log.filter" />
                </button>
            </div>
        </div>
    </form>

    <f:if condition="{logs}">
        <f:then>
            <p class="text-muted">
                {totalLogs} entries |
                <f:translate key="LLL:EXT:webmcp/Resources/Private/Language/locallang.xlf:log.page" /> {currentPage}
                <f:translate key="LLL:EXT:webmcp/Resources/Private/Language/locallang.xlf:log.of" /> {totalPages}
            </p>

            <div class="table-fit">
                <table class="table table-striped table-hover table-sm">
                    <thead>
                        <tr>
                            <th><f:translate key="LLL:EXT:webmcp/Resources/Private/Language/locallang.xlf:log.timestamp" /></th>
                            <th><f:translate key="LLL:EXT:webmcp/Resources/Private/Language/locallang.xlf:log.toolName" /></th>
                            <th><f:translate key="LLL:EXT:webmcp/Resources/Private/Language/locallang.xlf:log.userAgent" /></th>
                            <th><f:translate key="LLL:EXT:webmcp/Resources/Private/Language/locallang.xlf:log.success" /></th>
                            <th><f:translate key="LLL:EXT:webmcp/Resources/Private/Language/locallang.xlf:log.duration" /></th>
                            <th><f:translate key="LLL:EXT:webmcp/Resources/Private/Language/locallang.xlf:log.error" /></th>
                        </tr>
                    </thead>
                    <tbody>
                        <f:for each="{logs}" as="log">
                            <tr>
                                <td><f:format.date format="Y-m-d H:i:s">{log.timestamp}</f:format.date></td>
                                <td><span class="badge badge-info">{log.toolName}</span></td>
                                <td class="text-truncate" style="max-width: 250px;" title="{log.userAgent}">{log.userAgent}</td>
                                <td>
                                    <f:if condition="{log.success}">
                                        <f:then><span class="badge badge-success">OK</span></f:then>
                                        <f:else><span class="badge badge-danger">Error</span></f:else>
                                    </f:if>
                                </td>
                                <td>{log.durationMs} ms</td>
                                <td>{log.errorMessage}</td>
                            </tr>
                        </f:for>
                    </tbody>
                </table>
            </div>

            <nav>
                <ul class="pagination">
                    <f:if condition="{currentPage} > 1">
                        <li class="page-item">
                            <a href="{f:be.uri(route: 'content_webmcp.log', parameters: {site: selectedSite, page: '{currentPage - 1}'})}" class="page-link">
                                &laquo;
                            </a>
                        </li>
                    </f:if>
                    <f:if condition="{currentPage} < {totalPages}">
                        <li class="page-item">
                            <a href="{f:be.uri(route: 'content_webmcp.log', parameters: {site: selectedSite, page: '{currentPage + 1}'})}" class="page-link">
                                &raquo;
                            </a>
                        </li>
                    </f:if>
                </ul>
            </nav>
        </f:then>
        <f:else>
            <div class="callout callout-info">
                <f:translate key="LLL:EXT:webmcp/Resources/Private/Language/locallang.xlf:log.noEntries" />
            </div>
        </f:else>
    </f:if>

</f:section>

</html>
